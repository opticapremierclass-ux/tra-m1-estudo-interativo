<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRA M1 - Simulado final</title><style>
:root{--ink:#15252a;--muted:#607074;--line:#d9e2e0;--paper:#f4f7f6;--teal:#087f78;--red:#b3261e;--green:#157347;--amber:#f4b942}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif}header{background:#123a42;color:white;padding:22px 18px}.head{max-width:850px;margin:auto}.eyebrow{color:#8fe2d7;font-weight:800;text-transform:uppercase;font-size:12px}h1{font-size:clamp(26px,7vw,42px);margin:7px 0 5px;letter-spacing:0}header p{margin:0;color:#d5e8e7}.switch{max-width:850px;margin:12px auto;display:grid;grid-template-columns:repeat(3,1fr);background:white;border:1px solid var(--line)}.switch a{text-decoration:none;color:var(--ink);font-weight:800;text-align:center;padding:11px 5px;font-size:13px}.switch a+a{border-left:1px solid var(--line)}main{max-width:850px;margin:auto;padding:0 14px 40px}.status{display:flex;justify-content:space-between;gap:12px;margin:14px 0;color:var(--muted);font-weight:700}.bar{height:8px;background:#dce7e5}.bar i{display:block;height:100%;background:var(--teal)}.card{background:white;border:1px solid var(--line);margin-top:12px}.qhead{display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}.qbody{padding:18px}.qbody h2{font-size:20px;line-height:1.4;margin:0 0 16px;letter-spacing:0}.operator{color:var(--red);text-decoration:underline;font-weight:900}.option{width:100%;display:block;text-align:left;border:1px solid var(--line);background:white;padding:14px;margin:9px 0;font-size:15px;line-height:1.35;color:var(--ink);cursor:pointer}.option:hover,.option.selected{border-color:var(--teal);background:#eaf7f5}.option.correct{border-color:var(--green);background:#e8f5ed}.option.wrong{border-color:var(--red);background:#fbeceb}.feedback{margin-top:16px;border-left:5px solid var(--red);background:#fff4f2;padding:14px;line-height:1.5}.feedback.good{border-color:var(--green);background:#edf8f1}.feedback b{display:block;margin-bottom:5px}.actions{display:flex;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line)}button{border:1px solid var(--teal);background:white;color:var(--teal);font-weight:800;padding:11px 16px;cursor:pointer}button.primary{background:var(--teal);color:white}.result{text-align:center;padding:30px 20px}.result strong{display:block;font-size:48px;color:var(--teal)}.result ul{text-align:left;line-height:1.6}.trap{background:#fff6d8;border:1px solid #e7c75e;padding:11px;margin-bottom:12px;font-weight:700}@media(max-width:520px){.switch a{font-size:11px}.qbody{padding:15px}.qbody h2{font-size:18px}.status{font-size:13px}}
</style></head><body><header><div class="head"><div class="eyebrow">Traumatologia · M1 · simulado exclusivo</div><h1 id="title">Diagnóstico final</h1><p>Questões novas, alternativas plausíveis e foco nas armadilhas das aulas 1 e 2.</p></div></header><nav class="switch"><a href="index.html">Banco principal</a><a href="amanha.html">Treino misto</a><a href="sprint-3h.html">Sprint 3h</a></nav><main><div class="status"><span id="score">0 acertos</span><span id="counter">1 de 15</span></div><div class="bar"><i id="progress"></i></div><section class="card" id="card"></section></main><script>
const Q=[
{t:'Prioridades',q:'Sobre a participação do cirurgião bucomaxilofacial no politrauma, assinale a alternativa <span class="operator">INCORRETA</span>.',o:['Sua avaliação detalhada costuma integrar a avaliação secundária, depois de iniciada a estabilização.','Pode participar da avaliação primária quando a lesão facial ameaça a via aérea ou provoca hemorragia relevante.','A presença de trauma facial transfere automaticamente ao bucomaxilofacial a condução de todo o ABCDE.','O tratamento precoce das lesões faciais pode favorecer resultados funcionais e estéticos.'],c:2,e:'O ABCDE é conduzido pela equipe de trauma. O bucomaxilofacial pode atuar já na primária quando a face ameaça A ou C, mas isso não transfere automaticamente toda a condução.'},
{t:'ABCDE',q:'Um paciente com trauma facial apresenta sangue na boca, voz alterada e suspeita de lesão cervical. Qual conduta representa melhor a prioridade inicial?',o:['Examinar a oclusão antes de manipular a via aérea.','Garantir a permeabilidade da via aérea com proteção cervical e aspirar sangue ou detritos.','Solicitar tomografia e aguardar a definição anatômica.','Avaliar primeiro a resposta pupilar para excluir lesão óptica.'],c:1,e:'Sangue, secreções e alteração da voz sugerem ameaça à via aérea. A prioridade é A com proteção cervical; detalhes oclusais e imagem pertencem ao momento posterior.'},
{t:'ABCDE',q:'Assinale a associação <span class="operator">FALSA</span> no ABCDE.',o:['A: via aérea e proteção da coluna cervical.','B: ventilação, movimento torácico, oxigenação e capnografia quando indicada.','C: controle de hemorragia e avaliação da perfusão.','D: exposição completa e prevenção da hipotermia.'],c:3,e:'D é avaliação neurológica; exposição e prevenção da hipotermia correspondem a E.'},
{t:'Choque',q:'Após trauma, o paciente está taquicárdico, pálido e com extremidades frias, mas mantém pressão arterial normal. A interpretação mais adequada é:',o:['A pressão normal exclui choque hipovolêmico.','Pode haver choque compensado por catecolaminas e vasoconstrição periférica.','Trata-se necessariamente de choque neurogênico.','A perfusão é adequada porque o pulso ainda está presente.'],c:1,e:'Na fase compensada, vasoconstrição e taquicardia podem preservar temporariamente a pressão. Pele fria e palidez indicam hipoperfusão possível.'},
{t:'Choque',q:'Qual sequência descreve corretamente a tríade letal do trauma e sua relação?',o:['Hiperglicemia, febre e trombose; todas reduzem o sangramento.','Acidose, hipotermia e coagulopatia; cada componente agrava os demais.','Hipóxia, hipertensão e alcalose; decorrem apenas de TCE.','Acidose, hipertermia e coagulação acelerada; compensam a hemorragia.'],c:1,e:'Hipoperfusão favorece acidose; exposição e fluidos frios favorecem hipotermia; ambas prejudicam coagulação, ampliando o sangramento.'},
{t:'Glasgow',q:'Paciente abre os olhos à dor, emite palavras inadequadas e retira o membro ao estímulo doloroso. Qual registro está correto?',o:['E2 V3 M4 = 9.','E2 V2 M5 = 9.','E3 V3 M4 = 10.','E2 V3 M5 = 10.'],c:0,e:'Olhos à dor E2; palavras inadequadas V3; retirada à dor M4. Registre os componentes antes do total.'},
{t:'Glasgow',q:'Na resposta motora da Escala de Glasgow, qual alternativa está correta?',o:['Localizar a dor recebe pontuação menor que simplesmente retirar o membro.','Flexão anormal é M3 e extensão anormal é M2.','Ausência de resposta motora é M2.','Obedecer a comandos e localizar a dor recebem a mesma pontuação.'],c:1,e:'M6 obedece; M5 localiza; M4 retira; M3 flexão anormal/decorticação; M2 extensão/descerebração; M1 nenhuma.'},
{t:'LCR e base',q:'Sobre o líquido cefalorraquidiano (LCR), assinale a alternativa correta.',o:['É responsável por irrigar diretamente o tecido cerebral, substituindo o sangue.','Banhar e proteger o sistema nervoso central está entre suas funções; ele não substitui a irrigação sanguínea.','Rinorreia de LCR autoriza intubação nasal porque confirma passagem livre.','Otorreia de LCR exclui fratura de base do crânio.'],c:1,e:'O sangue irriga; o LCR circula, banha e protege. Rinorreia ou otorreia após trauma sugerem comunicação com o espaço liquórico e exigem cautela com via nasal.'},
{t:'Base craniana',q:'Qual conjunto aumenta a suspeita de fratura da base do crânio?',o:['Má oclusão isolada, abrasão labial e trismo.','Equimose retroauricular, rinorreia ou otorreia e hematoma periorbitário.','Crepitação mandibular, mobilidade dentária e laceração gengival.','Edema facial, epistaxe autolimitada e dor dentária.'],c:1,e:'Sinal de Battle, olhos de guaxinim e escape de LCR são achados clássicos de suspeita de fratura de base.'},
{t:'Secundária',q:'A avaliação secundária da face deve começar quando:',o:['Todas as fraturas já estiverem confirmadas por tomografia.','A avaliação primária foi realizada e o paciente iniciou estabilização; piora exige retorno ao ABCDE.','O cirurgião bucomaxilofacial chegar, independentemente do estado fisiológico.','Apenas quando não existir qualquer lesão em outros sistemas.'],c:1,e:'A secundária é um exame detalhado após abordar ameaças imediatas. Ela não depende de imagem pronta e nunca impede reavaliação do ABCDE.'},
{t:'Secundária',q:'Durante o exame secundário da face, todas são condutas pertinentes, <span class="operator">EXCETO</span>:',o:['Inspecionar assimetrias, edema e descoloração.','Palpar degraus, crepitação e irregularidades ósseas.','Avaliar nervos facial e trigêmeo, olhos, oclusão e cavidade oral.','Flexionar e estender o pescoço para pesquisar dor mesmo com suspeita cervical.'],c:3,e:'Com suspeita de lesão cervical, movimentos do pescoço devem ser evitados até liberação apropriada.'},
{t:'Via aérea',q:'Em fratura mandibular bilateral, qual mecanismo pode comprometer a via aérea?',o:['Deslocamento posterior da língua por perda de suporte anterior.','Elevação permanente da língua contra o palato duro.','Aumento da rigidez da parede posterior da faringe.','Bloqueio nasal sem qualquer repercussão orofaríngea.'],c:0,e:'A perda do suporte mandibular pode permitir queda posterior da língua, obstruindo a orofaringe, especialmente em paciente inconsciente.'},
{t:'Via aérea',q:'Em trauma facial, um dente está ausente e não foi localizado. A conduta interpretativa mais segura é:',o:['Considerar que foi perdido no local e encerrar a investigação.','Considerar possível aspiração ou deglutição e investigar conforme o quadro.','Presumir avulsão sem risco respiratório porque dentes não alcançam a via aérea.','Adiar qualquer avaliação até a reconstrução facial.'],c:1,e:'Dente, fragmento ou prótese ausente pode ter sido aspirado e tornar-se corpo estranho; não se deve presumir perda externa.'},
{t:'Respiração',q:'Qual achado avalia ventilação de forma mais direta que a oximetria isolada?',o:['Capnografia, associada ao exame da expansão torácica.','Cor da pele isoladamente.','Pressão arterial sistólica.','Resposta verbal da Escala de Glasgow.'],c:0,e:'A oximetria informa oxigenação e pode permanecer normal com oxigênio suplementar; capnografia e movimento torácico ajudam a avaliar ventilação.'},
{t:'Raciocínio',q:'Paciente estável apresenta hematoma facial expansivo e aumento progressivo da dificuldade respiratória. Qual afirmação é a melhor?',o:['Por estar na avaliação secundária, a equipe deve concluir o exame facial antes de intervir.','A expansão pode desviar ou estreitar a via aérea, exigindo retorno imediato à prioridade A.','A estabilidade inicial elimina risco de deterioração da via aérea.','O quadro pertence exclusivamente ao item D do ABCDE.'],c:1,e:'O ABCDE é dinâmico. Deterioração respiratória ou ameaça de via aérea interrompe a secundária e devolve o atendimento ao A.'}
];
const params=new URLSearchParams(location.search),round=params.get('round')||'diagnostico';document.querySelector('#title').textContent=round==='final'?'Prova final estratégica':'Diagnóstico estratégico';let order=[...Q.keys()];if(round==='final')order=order.slice().reverse();let i=0,correct=0,locked=false,selected=null,errors=[];const card=document.querySelector('#card');function render(){document.querySelector('#score').textContent=`${correct} acertos`;document.querySelector('#counter').textContent=`${Math.min(i+1,Q.length)} de ${Q.length}`;document.querySelector('#progress').style.width=`${i/Q.length*100}%`;if(i>=order.length){const pct=Math.round(correct/Q.length*100);card.innerHTML=`<div class="result"><span>Resultado</span><strong>${pct}%</strong><p>${correct} de ${Q.length} questões.</p><div class="trap">Meta: 90%. Abaixo disso, volte apenas aos temas errados e repita a prova final.</div><ul>${errors.length?errors.map(x=>`<li>${x}</li>`).join(''):'<li>Nenhum tema errado nesta rodada.</li>'}</ul><button class="primary" onclick="localStorage.removeItem('traM1Final');location.reload()">Refazer sem pistas</button></div>`;document.querySelector('#progress').style.width='100%';return}const x=Q[order[i]];card.innerHTML=`<div class="qhead"><b>${x.t}</b><span>Leia o operador antes das alternativas</span></div><div class="qbody"><h2>${x.q}</h2>${x.o.map((o,j)=>`<button class="option ${selected===j?'selected':''} ${locked&&j===x.c?'correct':''} ${locked&&selected===j&&j!==x.c?'wrong':''}" data-i="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}${locked?`<div class="feedback ${selected===x.c?'good':''}"><b>${selected===x.c?'Correto.':'Incorreto.'}</b>${x.e}</div>`:''}</div><div class="actions"><button class="primary" id="action">${locked?'Próxima':'Conferir'}</button></div>`;card.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(!locked){selected=+b.dataset.i;render()}});document.querySelector('#action').onclick=()=>{if(locked){i++;selected=null;locked=false;render();return}if(selected===null)return;locked=true;if(selected===x.c)correct++;else errors.push(x.t);render()}}render();
</script></body></html>
